<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>工程关系浏览器 · 选文件夹版</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#1f2937;background:#f4f5f7;display:flex;flex-direction:column;overflow:hidden}
  header{background:#0f172a;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .sub{font-size:11.5px;color:#94a3b8}
  header .sp{margin-left:auto}
  .btn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:6px 11px;border-radius:7px;font-size:12.5px;cursor:pointer}
  .btn:hover{background:#334155}
  .btn.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  .btn.primary:hover{background:#1d4ed8}
  .btn.on{background:#2563eb;border-color:#2563eb;color:#fff}
  .drop{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#475569;text-align:center;padding:30px}
  .drop .big{font-size:17px;font-weight:600;color:#1f2937}
  .drop small{color:#94a3b8;line-height:1.9}
  .drop.hot{background:#eff6ff;outline:2px dashed #60a5fa;outline-offset:-14px}
  main{flex:1;display:flex;min-height:0}
  aside{width:266px;flex:none;border-right:1px solid #e5e7eb;background:#fff;display:flex;flex-direction:column;min-height:0}
  aside .hd{padding:9px 10px;border-bottom:1px solid #eef2f7;font-size:12px;color:#475569}
  aside input{width:100%;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px}
  #tree{overflow:auto;flex:1;padding:6px}
  .fitem{padding:5px 7px;border-radius:6px;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center;line-height:1.35}
  .fitem:hover{background:#f1f5f9}
  .fitem.sel{background:#dbeafe;color:#1e3a8a;font-weight:600}
  .fitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fitem .ln{margin-left:auto;color:#94a3b8;font-size:11px;flex:none}
  .dir{padding:6px 7px 2px;font-size:11px;color:#64748b;font-weight:600}
  .center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .tblwrap{flex:none;max-height:38%;overflow:auto;background:#fff;border-bottom:1px solid #e5e7eb}
  .tblwrap .hd{position:sticky;top:0;background:#fff;padding:8px 12px;border-bottom:1px solid #eef2f7;font-size:12.5px;font-weight:600;color:#374151;display:flex;gap:10px;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:5px 10px;text-align:left;border-bottom:1px solid #f1f5f9;vertical-align:top}
  th{color:#64748b;font-weight:600;background:#fafafa;position:sticky;top:38px}
  tr.hl{background:#fff7ed}
  td.k{color:#64748b;white-space:nowrap}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#eef2ff;color:#3730a3}
  .tag.cls{background:#ede9fe;color:#5b21b6}
  .tag.def{background:#dcfce7;color:#166534}
  .tag.var{background:#fef3c7;color:#92400e}
  .tag.attr{background:#e0f2fe;color:#075985}
  .tag.imp{background:#f1f5f9;color:#475569}
  .tag.warn{background:#fee2e2;color:#991b1b}
  #stage{flex:1;position:relative;min-height:0;background:#fbfcfd}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  .legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid #e5e7eb;border-radius:8px;padding:7px 10px;font-size:11px;color:#475569;line-height:1.75;pointer-events:none}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .hint{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid #e5e7eb;border-radius:8px;padding:7px 10px;font-size:11px;color:#64748b;pointer-events:none;line-height:1.7}
  #panel{position:absolute;right:12px;top:12px;width:290px;max-height:70%;overflow:auto;background:rgba(255,255,255,.98);border:1px solid #e5e7eb;border-radius:10px;padding:12px;font-size:12.5px;box-shadow:0 6px 18px rgba(15,23,42,.08)}
  #panel h2{font-size:13px;margin:0 0 6px}
  .nb{font-size:12px;line-height:1.6;padding:5px 7px;border-radius:6px;cursor:pointer;border:1px solid #f1f5f9;margin-bottom:4px}
  .nb:hover{background:#f8fafc;border-color:#cbd5e1}
  .nb .ln{color:#94a3b8;margin-left:4px}
  .stat{font-size:11.5px;color:#64748b}
  code{background:#f1f5f9;padding:1px 4px;border-radius:4px;font-size:11.5px}
  .dim{color:#94a3b8}
  .stats{display:flex;gap:14px;flex-wrap:wrap;padding:7px 12px;background:#fff;border-bottom:1px solid #e5e7eb;font-size:11.5px;color:#475569;flex:none}

  /* 文件夹树 */
  .frow{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:6px;font-size:12.5px;cursor:pointer;user-select:none}
  .frow:hover{background:#f1f5f9}
  .frow.sel{background:#dbeafe;color:#1e3a8a;font-weight:600}
  .twist{width:14px;flex:none;text-align:center;color:#64748b;font-size:10px}
  .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{margin-left:auto;color:#94a3b8;font-size:11px;flex:none}
  .childbox{margin-left:12px;border-left:1px dashed #e2e8f0;padding-left:4px}
  /* 图上的悬停提示 */
  #tip{position:absolute;pointer-events:none;background:rgba(15,23,42,.94);color:#f8fafc;font-size:11.5px;
       padding:6px 9px;border-radius:7px;max-width:320px;line-height:1.6;display:none;z-index:9}
  .opt{font-size:12px;color:#475569;display:inline-flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
</style>
</head>
<body>
<header>
  <h1>🧭 工程关系浏览器</h1>
  <span class="sub" id="subtitle">选一个工程文件夹 → 侧栏点文件 → 看函数/变量表 + 关系图</span>
  <span class="sp"></span>
  <label class="btn primary" for="dirinput">📂 选择工程文件夹</label>
  <input id="dirinput" type="file" webkitdirectory directory multiple style="display:none" />
  <button class="btn" id="sample">载入示例（car 工程）</button>
  <button class="btn" id="mode-file">📄 文件详情</button>
  <button class="btn" id="mode-all">🌐 全项目</button>
  <label class="opt"><input type="checkbox" id="opt-imp" checked /> 显示 import 连线</label>
  <label class="opt"><input type="checkbox" id="opt-miss" checked /> 显示未定义调用</label>
</header>

<div class="stats" id="stats" style="display:none"></div>

<main id="main" style="display:none">
  <aside>
    <div class="hd">
      <input id="fsearch" type="search" placeholder="🔍 过滤文件…" autocomplete="off" />
      <div class="stat" id="filestat" style="margin-top:6px"></div>
    </div>
    <div id="tree"></div>
  </aside>
  <div class="center">
    <div class="tblwrap">
      <div class="hd"><span id="tbltitle">函数与变量</span><span class="stat" id="tblstat"></span></div>
      <table id="symtable">
        <thead><tr><th style="width:70px">类型</th><th style="width:190px">名称</th><th style="width:70px">行号</th><th>签名 / 值 / 说明</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div class="legend" id="legend"></div>
      <div class="hint">滚轮缩放 · 拖空白平移 · 拖节点微调 · 点节点看详情 · 双击居中</div>
      <div id="panel" style="display:none"></div>
      <div id="tip"></div>
    </div>
  </div>
</main>

<div class="drop" id="droparea">
  <div class="big">把工程文件夹拖到这里，或点右上角"📂 选择工程文件夹"</div>
  <small>
    浏览器里直接解析代码，不上传、不联网（打开本页即可用）<br />
    支持 <b>Python (.py)</b> 与 <b>C/C++（.c/.h/.cpp/.hpp/.ino，STM32 工程也认）</b>；其他文件会列在侧栏但不解析<br />
    也可以点"载入示例"先看看 car 工程的效果
  </small>
</div>

<script>
/* ============================================================
   1) 浏览器内 Python 解析器（纯函数，无 DOM 依赖）
   ============================================================ */
var PY_KEYWORDS = ['if','for','while','return','elif','else','with','assert','raise','yield','lambda',
  'print','len','range','int','str','float','list','dict','set','tuple','bool','bytes','type','isinstance',
  'super','enumerate','zip','sorted','max','min','sum','abs','round','any','all','open','ord','chr','exit',
  'input','hasattr','getattr','setattr','ValueError','Exception','NotImplementedError','Warning','True','False','None','not','and','or','in','is','del','global','nonlocal','pass','break','continue','try','except','finally','import','from','class','def','async','await','match','case','self'];

function parsePython(path, text){
  var res = { path:path, lines:0, hasMain:false, imports:[], classes:[], functions:[], methods:[], vars:[], calls:[], selfAttrs:[] };
  var lines = String(text).split(/\r?\n/);
  res.lines = lines.length;
  res.hasMain = /__main__/.test(String(text));
  var stack = [];            // [{indent,type,name,cls}]
  var ts = null;             // 三引号状态
  for (var i=0;i<lines.length;i++){
    var raw = lines[i], lineNo = i+1;
    // 三引号字符串切换（粗略）
    var tq = raw.match(/"""|'''/g);
    if (ts){ if (tq) ts = null; continue; }
    if (tq && tq.length % 2 === 1){ ts = true; continue; }
    var noComment = raw.replace(/#.*$/,'');
    if (!noComment.trim()) continue;
    var indent = noComment.match(/^[ \t]*/)[0].replace(/\t/g,'    ').length;

    while (stack.length && indent <= stack[stack.length-1].indent) stack.pop();
    var cur = stack.length ? stack[stack.length-1] : null;

    // import
    var mFrom = noComment.match(/^\s*from\s+([\.\w]+)\s+import\s+(.+)$/);
    var mImp  = noComment.match(/^\s*import\s+(.+)$/);
    if (mFrom){
      res.imports.push({ kind:'from', module:mFrom[1], symbols:mFrom[2].split(',').map(function(s){return s.trim().split(/\s+as\s+/).pop();}).filter(Boolean), line:lineNo });
      continue;
    }
    if (mImp){
      mImp[1].split(',').forEach(function(part){
        var bits = part.trim().split(/\s+as\s+/);
        res.imports.push({ kind:'import', module:bits[0], alias:bits[1]||bits[0].split('.')[0], symbols:[], line:lineNo });
      });
      continue;
    }
    // class
    var mCls = noComment.match(/^(\s*)class\s+(\w+)\s*(?:\(([^)]*)\))?\s*:/);
    if (mCls){
      var ce = { name:mCls[2], bases:(mCls[3]||'').trim(), line:lineNo, indent:indent, methods:[] };
      res.classes.push(ce);
      stack.push({ indent:indent, type:'class', name:mCls[2] });
      continue;
    }
    // def（支持签名跨行）
    var mDef = noComment.match(/^(\s*)(?:async\s+)?def\s+(\w+)\s*\(/);
    if (mDef){
      var sig = noComment.trim(); var j = i, bal = (sig.match(/\(/g)||[]).length - (sig.match(/\)/g)||[]).length;
      while (bal > 0 && j+1 < lines.length){ j++; sig += ' ' + lines[j].trim(); bal += (lines[j].match(/\(/g)||[]).length - (lines[j].match(/\)/g)||[]).length; }
      var args = (sig.match(/\(([^)]*)\)/)||['',''])[1].replace(/\s+/g,' ');
      var de = { name:mDef[2], args:args, line:lineNo, indent:indent, cls:(cur && cur.type==='class') ? cur.name : null };
      if (de.cls){ res.methods.push(de); var cc = null;
        for (var k=0;k<res.classes.length;k++) if (res.classes[k].name===de.cls) cc = res.classes[k];
        if (cc) cc.methods.push(de.name);
      } else res.functions.push(de);
      stack.push({ indent:indent, type:'def', name:mDef[2], cls:de.cls });
      continue;
    }
    // 赋值 / 变量
    var mAss = noComment.match(/^(\s*)((?:self\.)?[\w\.\[\]]+)\s*(?::\s*[^=]+)?=\s*(?!=)(.*)$/);
    if (mAss){
      var tgt = mAss[2].trim(), val = mAss[3].trim();
      var isSelf = /^self\./.test(tgt);
      var name = isSelf ? tgt : tgt.split('.')[0];
      var scope = cur ? (cur.type==='def' ? 'local' : 'class') : 'module';
      var rec = { name:name, value:val.slice(0,80), line:lineNo, scope:scope, isSelf:isSelf, cls:(cur&&cur.cls)||null };
      res.vars.push(rec);
      if (isSelf) res.selfAttrs.push(rec);
      continue;
    }
  }
  // 调用表达式（逐行扫，记录所在函数）
  var scopes = [];
  for (var li=0; li<lines.length; li++){
    var noC = lines[li].replace(/#.*$/,'');
    if (!noC.trim()) continue;
    var ind = noC.match(/^[ \t]*/)[0].replace(/\t/g,'    ').length;
    var md = noC.match(/^(\s*)(?:async\s+)?def\s+(\w+)\s*\(/);
    if (md){
      while (scopes.length && ind <= scopes[scopes.length-1].indent) scopes.pop();
      scopes.push({ indent:ind, name:md[2] }); continue;
    }
    if (/^(\s*)class\s+\w+/.test(noC)){
      while (scopes.length && ind <= scopes[scopes.length-1].indent) scopes.pop();
      continue;
    }
    var re = /([A-Za-z_]\w*(?:\.[A-Za-z_]\w*)*)\s*\(/g, mm;
    while ((mm = re.exec(noC)) !== null){
      var chain = mm[1];
      var head = chain.split('.')[0];
      var last = chain.split('.').pop();
      if (PY_KEYWORDS.indexOf(head) >= 0 && chain.indexOf('.') < 0) continue;
      if (['def','class','return','if','elif','while','for','with','assert','print'].indexOf(head) >= 0) continue;
      res.calls.push({ chain:chain, name:last, line:li+1,
                       inFunc: scopes.length ? scopes[scopes.length-1].name : null });
    }
  }
  return res;
}


/* ---------- C / C++ （STM32、单片机）解析器 ---------- */
var C_KEYWORDS = ['if','for','while','switch','case','default','return','sizeof','do','else','break','continue','goto',
 'typedef','struct','union','enum','static','const','volatile','extern','inline','register','restrict','_Bool',
 'unsigned','signed','void','char','short','int','long','float','double','auto','class','new','delete','this','nullptr',
 'uint8_t','uint16_t','uint32_t','uint64_t','int8_t','int16_t','int32_t','int64_t','u8','u16','u32','size_t','bool',
 'true','false','NULL','TRUE','FALSE','_Static_assert','__attribute__','__asm','asm','__inline','__weak','__IO','__I','__O'];

function parseC(path, text){
  var res = { path:path, lang:'c', lines:0, hasMain:false, imports:[], classes:[], functions:[], methods:[], vars:[], calls:[], decls:[] };
  var lines = String(text).split(/\r?\n/);
  res.lines = lines.length;
  res.hasMain = /(^|\W)main\s*\(/.test(String(text));
  var inBlockComment = false, depth = 0, curFunc = null, pendingStruct = null;

  function stripComment(line){
    var out = '';
    for (var i=0;i<line.length;i++){
      if (inBlockComment){
        if (line.substr(i,2) === '*/'){ inBlockComment = false; i++; }
        continue;
      }
      if (line.substr(i,2) === '//') break;
      if (line.substr(i,2) === '/*'){ inBlockComment = true; i++; continue; }
      out += line[i];
    }
    return out;
  }
  function countBraces(t){
    var o = 0, c = 0, inStr = false, q = '';
    for (var i=0;i<t.length;i++){
      var ch = t[i];
      if (inStr){ if (ch === q && t[i-1] !== '\\') inStr = false; continue; }
      if (ch === '"' || ch === "'"){ inStr = true; q = ch; continue; }
      if (ch === '{') o++; else if (ch === '}') c++;
    }
    return { open:o, close:c };
  }

  for (var li=0; li<lines.length; li++){
    var raw = lines[li], ln = li+1;
    var t = stripComment(raw);
    if (!t.trim()) continue;
    var trimmed = t.trim();
    var isSigLine = false;

    // #include / #define
    var mInc = trimmed.match(/^#\s*include\s*[<"]([^>"]+)[>"]/);
    if (mInc){
      res.imports.push({ kind:'include', module:mInc[1].replace(/\\/g,'/'), symbols:[], line:ln,
                         system: /^#\s*include\s*</.test(trimmed) });
      continue;
    }
    var mDef = trimmed.match(/^#\s*define\s+([A-Za-z_]\w*)(\((?:[^)]*)\))?\s*(.*)$/);
    if (mDef){
      res.vars.push({ name:mDef[1], value:(mDef[3]||'').slice(0,70), line:ln, scope:'module',
                      kind:'macro', isSelf:false, cls:null });
      continue;
    }
    // struct / enum / union 定义
    var mStruct = trimmed.match(/^(typedef\s+)?(struct|enum|union)\s*([A-Za-z_]\w*)?\s*(\{)?/);
    if (mStruct && (mStruct[3] || mStruct[4])){
      var sname = mStruct[3];
      if (sname){ res.classes.push({ name:sname, bases:mStruct[2], line:ln, methods:[] }); }
      else if (mStruct[4]){ pendingStruct = { name:'(匿名' + mStruct[2] + ')', bases:mStruct[2], line:ln, methods:[] }; }
    }
    var mTypedefTail = trimmed.match(/^\}\s*([A-Za-z_]\w*)\s*;/);
    if (mTypedefTail){
      if (pendingStruct){ pendingStruct.name = mTypedefTail[1]; res.classes.push(pendingStruct); pendingStruct = null; }
      else if (!res.classes.some(function(c){ return c.name === mTypedefTail[1]; }))
        res.classes.push({ name:mTypedefTail[1], bases:'typedef', line:ln, methods:[] });
    }

    var br = countBraces(t);
    // 函数定义（文件作用域，含返回类型）
    if (depth === 0){
      var mFn = t.match(/^\s*(?:static\s+|inline\s+|extern\s+|const\s+|volatile\s+|__weak\s+|__inline\s+)*([A-Za-z_][\w\s\*\.]*?)\s*\*?\s*([A-Za-z_]\w*)\s*\(([^;{)]*)\)\s*(\{|;|$)/);
      if (mFn && C_KEYWORDS.indexOf(mFn[2]) < 0 && !/^\s*(if|for|while|switch|return)\b/.test(trimmed)){
        isSigLine = true;
        var nxt = '';
        for (var kk = li + 1; kk < lines.length && kk < li + 4; kk++){
          var t2 = stripComment(lines[kk]).trim();
          if (t2){ nxt = t2; break; }
        }
        var isDef = (mFn[4] === '{') || trimmed.indexOf('{') >= 0 || br.open > 0 || nxt.charAt(0) === '{';
        var rec = { name:mFn[2], args:(mFn[3]||'').trim(), line:ln, ret:(mFn[1]||'').trim(),
                    decl:!isDef, file:path };
        res.functions.push(rec);
        if (!isDef) res.decls.push(rec.name);
        if (isDef) curFunc = rec.name;
      } else {
        // 文件级变量
        var mVar = t.match(/^\s*(?:static\s+|const\s+|volatile\s+|extern\s+)*([A-Za-z_]\w*(?:\s*\*)?(?:\s+[A-Za-z_]\w*)*)\s+([A-Za-z_]\w*)\s*(\[[^\]]*\])?\s*(=|;)/);
        if (mVar && C_KEYWORDS.indexOf(mVar[2]) < 0 && !/^\s*#/.test(trimmed)){
          res.vars.push({ name:mVar[2], value:(t.split('=')[1]||'').trim().slice(0,70), line:ln, scope:'module',
                          kind:'var', isSelf:false, cls:null });
        }
      }
    }
    // 函数内局部变量
    if (depth > 0 && curFunc){
      var mLoc = t.match(/^\s*(?:static\s+|const\s+|volatile\s+|register\s+)*([A-Za-z_]\w*(?:\s*\*)?)\s+([A-Za-z_]\w*)\s*(\[[^\]]*\])?\s*(=|;)/);
      if (mLoc && C_KEYWORDS.indexOf(mLoc[1]) < 0 && C_KEYWORDS.indexOf(mLoc[2]) < 0)
        res.vars.push({ name:mLoc[2], value:(t.split('=')[1]||'').trim().slice(0,60), line:ln, scope:'local',
                        kind:'local', isSelf:false, cls:null });
    }
    // 成员访问 / 调用（函数签名行不算调用）
    if (!isSigLine) {
    var re = /([A-Za-z_]\w*(?:\s*(?:->|\.)\s*[A-Za-z_]\w*)*)\s*\(/g, mm;
    while ((mm = re.exec(t)) !== null){
      var chainRaw = mm[1].replace(/\s*(->|\.)\s*/g, '.');
      var head = chainRaw.split('.')[0];
      if (C_KEYWORDS.indexOf(head) >= 0) continue;
      if (/^\s*(if|for|while|switch|return|sizeof|case|do|else|typedef|struct|union|enum)$/.test(head)) continue;
      res.calls.push({ chain:chainRaw, name:chainRaw.split('.').pop(), line:ln, inFunc: (depth>0 ? curFunc : null) });
    }
    }
    depth += br.open - br.close;
    if (depth <= 0){ depth = 0; curFunc = null; }
  }
  return res;
}

/* ============================================================
   2) 工程装配：解析所有代码文件，解析 import/include / 调用目标
   ============================================================ */
var PROJ = { root:'', files:[], py:{}, byPath:{}, symbols:{}, errors:[] };

var PARSE_EXT = /\.(py|c|h|cpp|cc|cxx|hpp|hh|hxx|ino)$/i;
var CODE_EXT  = /\.(py|c|h|cpp|cc|cxx|hpp|hh|hxx|ino|s|asm|ld|mk|txt|md|json|cfg|ini|ioc|uvprojx|uvproj|bat|sh)$/i;
function isCode(p){ return PARSE_EXT.test(p); }
function langOf(p){ return /\.py$/i.test(p) ? 'py' : 'c'; }
function normPath(p){ return String(p).replace(/\\/g,'/').replace(/^\.\//,''); }
function dirOf(p){ var a = normPath(p).split('/'); a.pop(); return a.join('/'); }
function baseName(p){ var a = normPath(p).split('/'); return a[a.length-1]; }

function buildProject(rootName, fileList){
  PROJ = { root:rootName, files:[], py:{}, byPath:{}, symbols:{}, errors:[] };
  fileList.forEach(function(f){ PROJ.files.push(f); if (isCode(f.path)) PROJ.byPath[normPath(f.path)] = f; });
  var allPy = Object.keys(PROJ.byPath);
  // 模块名解析（支持相对导入）
  function resolve(mod, level, fromPath){
    var parts;
    if (level > 0){
      var d = dirOf(fromPath).split('/'); d = d.filter(Boolean);
      if (level > 1) d = d.slice(0, d.length - (level - 1));
      parts = d.concat(mod ? mod.split('.') : []);
    } else parts = mod ? mod.split('.') : [];
    var cand = parts.join('/') + '.py';
    if (PROJ.byPath[cand]) return cand;
    var cand2 = parts.join('/') + '/__init__.py';
    if (PROJ.byPath[cand2]) return cand2;
    // 回退：同名文件唯一
    var base = parts[parts.length-1] + '.py';
    var hits = allPy.filter(function(p){ return p === base || p.slice(-(base.length+1)) === '/' + base; });
    return hits.length === 1 ? hits[0] : null;
  }
  Object.keys(PROJ.byPath).forEach(function(p){
    var f = PROJ.byPath[p];
    try { PROJ.py[p] = (langOf(p) === 'py') ? parsePython(p, f.text) : parseC(p, f.text); }
    catch(e){ PROJ.errors.push(p + ': ' + e.message); }
  });
  finalizeProject();
}

/* 由已解析的 PROJ.py 计算 import 边与别名表（实时解析与示例数据共用） */
function finalizeProject(){
  var allPy = Object.keys(PROJ.byPath);
  function resolve(mod, level, fromPath){
    var parts;
    if (level > 0){
      var d = dirOf(fromPath).split('/'); d = d.filter(Boolean);
      if (level > 1) d = d.slice(0, d.length - (level - 1));
      parts = d.concat(mod ? mod.split('.') : []);
    } else parts = mod ? mod.split('.') : [];
    var cand = parts.join('/') + '.py';
    if (PROJ.byPath[cand]) return cand;
    var cand2 = parts.join('/') + '/__init__.py';
    if (PROJ.byPath[cand2]) return cand2;
    var base = parts[parts.length-1] + '.py';
    var hits = allPy.filter(function(p){ return p === base || p.slice(-(base.length+1)) === '/' + base; });
    return hits.length === 1 ? hits[0] : null;
  }
  PROJ.importEdges = [];
  Object.keys(PROJ.py).forEach(function(p){
    var ast = PROJ.py[p];
    ast._aliasMap = {};
    ast._includeTargets = [];
    (ast.imports || []).forEach(function(im){
      if (im.kind === 'include'){
        var dir = dirOf(p), cands = [];
        cands.push(dir ? dir + '/' + im.module : im.module);
        cands.push(im.module);
        var tgtC = cands.filter(function(c){ return !!PROJ.byPath[c]; })[0] || null;
        if (!tgtC){
          var hitsC = Object.keys(PROJ.byPath).filter(function(q){ return baseName(q) === baseName(im.module); });
          if (hitsC.length === 1) tgtC = hitsC[0];
        }
        im.target = tgtC;
        PROJ.importEdges.push({ src:p, dst:tgtC, module:im.module, symbols:[], line:im.line, resolved:!!tgtC, isInclude:true });
        if (tgtC) ast._includeTargets.push(tgtC);
        return;
      }
      var lvl = (im.module.match(/^\.+/)||[''])[0].length;
      var mod = im.module.replace(/^\.+/,'');
      var tgt = resolve(mod, lvl, p);
      im.target = tgt;
      PROJ.importEdges.push({ src:p, dst:tgt, module:im.module, symbols:im.symbols, line:im.line, resolved:!!tgt });
      if (im.kind === 'import') ast._aliasMap[im.alias || mod.split('.')[0]] = tgt;
      else ast._aliasMap['__from__' + im.module] = tgt;
      (im.symbols||[]).forEach(function(sym){ ast._aliasMap[sym] = tgt; });
    });
  });
  PROJ.IDX = null;
}

/* ============================================================
   3) 关系计算：某个文件的调用方/被调用方 + 未定义引用
   ============================================================ */
var PY_BUILTIN = new Set(['print','len','range','int','str','float','list','dict','set','tuple','bool','bytes',
 'type','isinstance','super','enumerate','zip','sorted','max','min','sum','abs','round','any','all','open','ord','chr',
 'exit','input','hasattr','getattr','setattr','repr','format','map','filter','reversed','divmod','pow','hex','bin','oct',
 'ValueError','TypeError','KeyError','IndexError','Exception','RuntimeError','NotImplementedError','AttributeError','Warning',
 'StopIteration','ZeroDivisionError','object','property','staticmethod','classmethod','next','iter','vars','id','callable']);

function ctorOf(val){
  var m = String(val||'').match(/^([\w\.]+)\s*\(/);
  return m ? m[1].split('.').pop() : null;
}

function buildIndex(){
  var I = { funcs:{}, methods:{}, classes:{}, files:{} };
  Object.keys(PROJ.py).forEach(function(q){
    var a = PROJ.py[q];
    var f = { funcs:{}, methods:{} };
    (a.functions||[]).forEach(function(fn){ f.funcs[fn.name] = fn.line;
      (I.funcs[fn.name] = I.funcs[fn.name] || []).push({file:q, line:fn.line, decl:!!fn.decl}); });
    (a.methods||[]).forEach(function(m){ f.methods[m.name] = m.line; (I.methods[m.name] = I.methods[m.name] || []).push({file:q, line:m.line, cls:m.cls}); });
    (a.classes||[]).forEach(function(c){ I.classes[c.name] = { file:q, line:c.line, methods:(c.methods||[]) }; });
    f.funcCls = {};
    (a.methods||[]).forEach(function(m){ f.funcCls[m.name] = m.cls; });
    f.instAttrs = {};      // 类实例属性: self.x -> 构造类名
    f.plainAttrs = {};     // 类的所有 self.x 属性名
    (a.vars||[]).forEach(function(v){
      if (!v.isSelf || !v.cls) return;
      var key = String(v.name).replace(/^self\./,'');
      f.instAttrs[v.cls] = f.instAttrs[v.cls] || {};
      f.plainAttrs[v.cls] = f.plainAttrs[v.cls] || {};
      f.plainAttrs[v.cls][key] = 1;
      if (v.value) f.instAttrs[v.cls][key] = ctorOf(v.value);
    });
    f.localInst = {};      // 函数内局部变量 -> 构造类名
    (a.vars||[]).forEach(function(v){
      if (v.isSelf || v.scope !== 'local') return;
      f.localInst[v.name] = ctorOf(v.value);
    });
    f.macros = {};
    (a.vars||[]).forEach(function(v){ if (v.kind === 'macro') f.macros[v.name] = v.line; });
    f.includeTargets = a._includeTargets || [];
    f.fromSymbols = {};    // from X import y  -> 目标文件
    (a.imports||[]).forEach(function(im){
      if (im.kind === 'from') (im.symbols||[]).forEach(function(sym){ f.fromSymbols[sym] = im.target || null; });
    });
    I.files[q] = f;
  });
  // 解析每条调用：internal / undefined / external
  Object.keys(PROJ.py).forEach(function(q){
    var a = PROJ.py[q], F = I.files[q];
    a._resolvedCalls = [];
    (a.calls||[]).forEach(function(c){
      var chain = String(c.chain).split('.');
      var cls = c.inFunc ? (F.funcCls[c.inFunc] || null) : null;
      var r = { from:{ file:q, inFunc:c.inFunc, line:c.line, expr:c.chain }, to:null, kind:'external' };

      function projectClassOwner(cname){ return I.classes[cname] || null; }
      function methodIn(cname, mname){
        var co = projectClassOwner(cname);
        if (!co) return null;
        if ((co.methods||[]).indexOf(mname) < 0) return null;
        var mid = (I.methods[mname]||[]).filter(function(x){ return x.file===co.file && x.cls===cname; })[0];
        return { file:co.file, name:mname, cls:cname, line: mid ? mid.line : co.line };
      }
      function uniqueByName(name, kind){
        var arr = (kind==='method' ? I.methods[name] : I.funcs[name]) || [];
        var defs = arr.filter(function(x){ return !x.decl; });       // 优先指向真正定义
        var use = defs.length ? defs : arr;
        var files = {}; use.forEach(function(x){ files[x.file]=1; });
        if (use.length === 1 && Object.keys(files).length === 1)
          return { file:use[0].file, name:name, cls:use[0].cls || null, line:use[0].line };
        return null;
      }

      if (chain.length === 1){
        var n = chain[0];
        if (PY_BUILTIN.has(n)) { r.kind = 'external'; }
        else if (F.funcs[n] !== undefined) { r.to = { file:q, name:n, line:F.funcs[n] }; r.kind = 'internal'; }
        else if (F.fromSymbols[n] !== undefined){
          var tf = F.fromSymbols[n];
          if (tf && PROJ.py[tf]){
            var ff = PROJ.py[tf].functions.filter(function(x){return x.name===n;})[0];
            var mm = PROJ.py[tf].methods.filter(function(x){return x.name===n;})[0];
            if (ff) { r.to = { file:tf, name:n, line:ff.line }; r.kind='internal'; }
            else if (mm) { r.to = { file:tf, name:n, cls:mm.cls, line:mm.line }; r.kind='internal'; }
            else r.kind = 'external';
          } else r.kind = 'external';
        }
        else {
          if (F.macros[n] !== undefined){ r.to = { file:q, name:n, line:F.macros[n], macro:true }; r.kind = 'internal'; }
          else {
            var u = uniqueByName(n,'func');
            if (u){ r.to = u; r.kind='internal'; }
            else {
              var viaInc = null;
              (F.includeTargets||[]).some(function(tf){
                var ta = PROJ.py[tf]; if (!ta) return false;
                var fns2 = (ta.functions||[]).filter(function(x){ return x.name === n; });
                var ff2 = fns2.filter(function(x){ return !x.decl; })[0] || fns2[0];
                if (ff2){ viaInc = { file:tf, name:n, line:ff2.line }; return true; }
                var mac2 = (ta.vars||[]).filter(function(x){ return x.kind==='macro' && x.name===n; })[0];
                if (mac2){ viaInc = { file:tf, name:n, line:mac2.line, macro:true }; return true; }
                return false;
              });
              if (viaInc){ r.to = viaInc; r.kind='internal'; }
              else if (I.classes[n]) r.kind = 'external';
              else if (/^(HAL_|LL_|__HAL|HAL$)/.test(n)) r.kind = 'external';
              else r.kind = 'undefined';
            }
          }
        }
      }
      else if (chain[0] === 'self'){
        var last = chain[chain.length-1];
        if (chain.length === 2){
          if (cls){
            if (F.methods[last] !== undefined && (I.files[q].funcCls[last] === undefined || true)){
              var own = (I.methods[last]||[]).filter(function(x){return x.file===q && x.cls===cls;})[0];
              if (own){ r.to = { file:q, name:last, cls:cls, line:own.line }; r.kind='internal'; }
            }
            if (!r.to && (F.plainAttrs[cls]||{})[last]) r.kind = 'external';
            if (!r.to && r.kind !== 'external'){
              var u2 = uniqueByName(last,'method');
              if (u2) { r.to = u2; r.kind='internal'; } else r.kind = 'undefined';
            }
          } else r.kind = 'external';
        } else {
          var owner = chain[chain.length-2];
          var cname2 = cls ? ((F.instAttrs[cls]||{})[owner]) : null;
          if (cname2){
            var hit = methodIn(cname2, last);
            if (hit) { r.to = hit; r.kind='internal'; }
            else if (I.classes[cname2]) r.kind = 'undefined';
            else r.kind = 'external';
          } else if (cls && (F.plainAttrs[cls]||{})[owner]) r.kind = 'external';
          else r.kind = 'external';
        }
      }
      else {
        var head = chain[0], lastN = chain[chain.length-1];
        var aliasTgt = (a._aliasMap||{})[head];
        if (aliasTgt && PROJ.py[aliasTgt]){
          var f3 = PROJ.py[aliasTgt].functions.filter(function(x){return x.name===lastN;})[0];
          var m3 = PROJ.py[aliasTgt].methods.filter(function(x){return x.name===lastN;})[0];
          if (f3){ r.to = { file:aliasTgt, name:lastN, line:f3.line }; r.kind='internal'; }
          else if (m3){ r.to = { file:aliasTgt, name:lastN, cls:m3.cls, line:m3.line }; r.kind='internal'; }
          else r.kind = 'external';
        } else if (F.fromSymbols[head] !== undefined) r.kind = 'external';
        else {
          var inst = F.localInst[head];
          if (inst && I.classes[inst]){
            if (chain.length === 2){
              var h2 = methodIn(inst, lastN);
              if (h2) { r.to = h2; r.kind='internal'; } else r.kind = 'undefined';
            } else r.kind = 'external';
          } else r.kind = 'external';
        }
      }
      a._resolvedCalls.push(r);
    });
  });
  PROJ.IDX = I;
}

function fileRelations(path){
  var p = normPath(path), r = { imports:[], importedBy:[], callsOut:[], callsIn:[], undefined:[] };
  if (!PROJ.py[p]) return r;
  if (!PROJ.IDX) buildIndex();
  PROJ.importEdges.forEach(function(e){
    if (e.src === p) r.imports.push(e);
    if (e.dst === p) r.importedBy.push(e);
  });
  Object.keys(PROJ.py).forEach(function(q){
    (PROJ.py[q]._resolvedCalls || []).forEach(function(rc){
      if (rc.from.file === p && rc.kind === 'undefined') r.undefined.push({ line:rc.from.line, expr:rc.from.expr, inFunc:rc.from.inFunc });
      if (rc.from.file === p && rc.to && rc.to.file !== p)
        r.callsOut.push({ file:rc.to.file, line:rc.from.line, expr:rc.from.expr, targetLine:rc.to.line, cls:rc.to.cls || null, name:rc.to.name });
      if (rc.to && rc.to.file === p && rc.from.file !== p)
        r.callsIn.push({ file:rc.from.file, line:rc.from.line, expr:rc.from.expr, name:rc.to.name });
    });
  });
  return r;
}

/* ============================================================
   4) UI：侧栏、表格、关系图

var $ = function(id){ return document.getElementById(id); };
var UI = { files:[], sel:null, mode:'file', q:'', scale:1, ox:0, oy:0, nodes:[], edges:[], index:{}, dragging:null, panning:false, selNode:null };

function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function kindColor(k){ return { root:'#2563eb', models:'#059669', tests:'#d97706', core:'#0891b2', lib:'#7c3aed', missing:'#dc2626', file:'#2563eb' }[k] || '#64748b'; }
function kindOfPath(f){
  var seg = String(f).split('/'), s = seg.length > 1 ? seg[0].toLowerCase() : '';
  if (s === 'models') return 'models';
  if (s === 'tests' || s === 'test') return 'tests';
  if (s === 'core') return 'core';
  if (s === 'drivers' || s === 'library' || s === 'libraries' || s === 'cmsis' || s === 'middlewares' || s === 'hal') return 'lib';
  return 'root';
}

function renderStats(){
  var pyc = Object.keys(PROJ.py).length, fn = 0, cl = 0, vv = 0, ce = 0;
  Object.keys(PROJ.py).forEach(function(p){
    var a = PROJ.py[p]; fn += a.functions.length + a.methods.length; cl += a.classes.length; vv += a.vars.length; ce += a.calls.length;
  });
  $('stats').style.display = 'flex';
  $('stats').innerHTML = '<span>📁 工程：<b>' + esc(PROJ.root || '(未命名)') + '</b></span>' +
    '<span>文件 <b>' + PROJ.files.length + '</b>（Python ' + pyc + '）</span>' +
    '<span>类 <b>' + cl + '</b></span><span>函数/方法 <b>' + fn + '</b></span>' +
    '<span>变量 <b>' + vv + '</b></span><span>调用表达式 <b>' + ce + '</b></span>' +
    '<span>import 边 <b>' + PROJ.importEdges.filter(function(e){return e.resolved;}).length + '</b></span>' +
    (PROJ.errors.length ? '<span class="tag warn">解析失败 ' + PROJ.errors.length + '</span>' : '');
}

var TREE_OPEN = {};          // 目录展开状态

function renderTree(){
  var el = $('tree'); el.innerHTML = '';
  var q = UI.q.toLowerCase();
  var files = PROJ.files.slice();
  if (q) files = files.filter(function(f){ return f.path.toLowerCase().indexOf(q) >= 0; });

  // 构建目录树
  var root = { dirs:{}, files:[] };
  files.forEach(function(f){
    var parts = f.path.split('/'); var node = root;
    for (var i=0;i<parts.length-1;i++){
      var d = parts[i];
      node.dirs[d] = node.dirs[d] || { dirs:{}, files:[], name:d };
      node = node.dirs[d];
    }
    node.files.push(f);
  });
  function countAll(node){
    var n = node.files.length;
    Object.keys(node.dirs).forEach(function(k){ n += countAll(node.dirs[k]); });
    return n;
  }
  function drawDir(node, path, box){
    Object.keys(node.dirs).sort().forEach(function(name){
      var sub = node.dirs[name];
      var full = path ? path + '/' + name : name;
      var open = q ? true : (TREE_OPEN[full] !== false);   // 默认展开，搜索时全展开
      var row = document.createElement('div'); row.className = 'frow';
      row.innerHTML = '<span class="twist">' + (open ? '▾' : '▸') + '</span><span>📂</span>' +
                      '<span class="fname" title="'+esc(full)+'">'+esc(name)+'</span><span class="meta">'+countAll(sub)+'</span>';
      row.addEventListener('click', function(e){
        e.stopPropagation();
        TREE_OPEN[full] = !open; renderTree();
      });
      box.appendChild(row);
      if (open){
        var cb = document.createElement('div'); cb.className = 'childbox';
        drawDir(sub, full, cb); drawFiles(sub.files, cb); box.appendChild(cb);
      }
    });
  }
  function drawFiles(list, box){
    list.sort(function(a,b){ return a.path.localeCompare(b.path); }).forEach(function(f){
      var py = /\.py$/i.test(f.path), clike = !py && isCode(f.path);
      var row = document.createElement('div');
      row.className = 'frow' + (UI.sel === f.path ? ' sel' : '');
      row.innerHTML = '<span class="twist"></span><span>' + (py?'🐍':(clike?'🔧':'📄')) + '</span>' +
                      '<span class="fname" title="'+esc(f.path)+'">'+esc(baseName(f.path))+'</span>' +
                      '<span class="meta">'+(f.lines||0)+'行</span>';
      row.addEventListener('click', function(){ selectFile(f.path); });
      box.appendChild(row);
    });
  }
  drawDir(root, '', el); drawFiles(root.files, el);
  if (!files.length){ el.innerHTML = '<div class="stat" style="padding:8px">没有匹配的文件</div>'; }
  var pyN = PROJ.files.filter(function(f){return /\.py$/i.test(f.path);}).length;
  var cN = PROJ.files.filter(function(f){return !/\.py$/i.test(f.path) && isCode(f.path);}).length;
  $('filestat').textContent = PROJ.files.length + ' 个文件（Python ' + pyN + ' · C/C++ ' + cN + '）· 点文件夹名可折叠';
}

function selectFile(path){
  UI.sel = path; UI.mode = 'file'; $('mode-file').classList.add('on'); $('mode-all').classList.remove('on');
  renderTree(); renderTable(); renderGraph(); $('panel').style.display='none';
}

function renderTable(){
  var tb = $('symtable').querySelector('tbody'); tb.innerHTML = '';
  var title = $('tbltitle'), stat = $('tblstat');
  if (!UI.sel){ title.textContent = '函数与变量'; stat.textContent = '（先在左侧选一个文件）'; return; }
  var ast = PROJ.py[normPath(UI.sel)];
  title.textContent = '函数与变量 · ' + UI.sel;
  if (!ast){
    stat.textContent = '该文件不是 Python（仅列在侧栏，未解析）';
    return;
  }
  var rel = fileRelations(UI.sel);
  var undefByLine = {}; rel.undefined.forEach(function(u){ (undefByLine[u.line]=undefByLine[u.line]||[]).push(u); });
  var rows = [];
  ast.classes.forEach(function(c){
    var isC = ast.lang === 'c';
    rows.push(['class', isC ? '结构体/枚举' : '类', c.name, c.line,
               (c.bases ? (isC ? '类型: '+c.bases : '继承/基类: '+c.bases) : '') + (c.methods && c.methods.length ? ' · 方法 '+c.methods.length+' 个' : '')]);
  });
  ast.functions.forEach(function(f){
    var isC = ast.lang === 'c';
    rows.push(['def', f.decl ? '函数声明' : '函数', f.name, f.line,
               isC ? ((f.ret ? f.ret + ' ' : '') + f.name + '(' + f.args + ')') : ('def ' + f.name + '(' + f.args + ')')]);
  });
  ast.methods.forEach(function(m){ rows.push(['def','方法', (m.cls? m.cls+'.':'') + m.name, m.line, 'def ' + m.name + '(' + m.args + ')']); });
  ast.vars.forEach(function(v){
    var kind = v.kind === 'macro' ? '宏定义'
             : (v.scope === 'module' ? '全局变量' : (v.scope === 'class' ? '类属性' : (v.isSelf ? '实例属性' : '局部变量')));
    rows.push(['var', kind, v.name, v.line, (v.kind === 'macro' ? '#define ' : '') + (v.value ? '= ' + v.value : '')]);
  });
  ast.imports.forEach(function(im){
    if (im.kind === 'include'){
      rows.push(['imp','include', im.module, im.line,
                 (im.system ? '#include <…>（系统/库头文件）' : '#include "…"') + (im.target ? '  → ' + im.target : '  (未在本工程内找到)')]);
    } else {
      rows.push(['imp','import', im.module, im.line, im.kind==='from' ? ('from … import ' + im.symbols.join(', ')) : 'import ' + im.module + (im.target? '  → ' + im.target : '  (外部库)')]);
    }
  });
  rows.sort(function(a,b){ return a[3]-b[3]; });
  var tmpl = { 'class':'cls', 'def':'def', 'var':'var', 'imp':'imp' };
  rows.forEach(function(r){
    var tr = document.createElement('tr');
    var calls = ast.calls.filter(function(c){ return c.line === r[3] || (c.inFunc === r[2] && c.line >= r[3] && c.line < r[3]+1); }).length;
    var note = r[4];
    if (undefByLine[r[3]]) note += ' · <span class="tag warn">此处调用了未定义: ' + undefByLine[r[3]].map(function(u){return esc(u.expr);}).join('、') + '</span>';

function highlightLine(ln, focus){

function buildGraph(){
  var nodes = [], edges = [], seen = {};
  function add(n){
    if (seen[n.id]) return seen[n.id];
    seen[n.id] = n; nodes.push(n); return n;
  }
  function fileKind(f){ return kindOfPath(f); }

  if (UI.mode === 'all'){
    PROJ.files.forEach(function(f){
      if (!isCode(f.path)) return;
      var ast = PROJ.py[f.path] || { functions:[], methods:[], vars:[], classes:[], lines:0 };
      add({ id:f.path, type:'file', file:f.path, label:baseName(f.path), kind:fileKind(f.path),
            lines:f.lines, count:(ast.functions.length + ast.methods.length), varCount:(ast.vars||[]).length });
    });
    PROJ.importEdges.forEach(function(e){
      if (e.dst && seen[e.src] && seen[e.dst])
        edges.push({ s:e.src, t:e.dst, line:e.line, imp:true, cross:true,
                     label:(e.symbols||[]).slice(0,2).join(',') + ((e.symbols||[]).length>2?'…':'') });
    });
  } else {
    var p = normPath(UI.sel);
    if (!p || !PROJ.py[p]) return { nodes:[], edges:[] };
    var ast = PROJ.py[p], rel = fileRelations(p);

    // 本文件节点
    add({ id:p, type:'file', file:p, label:baseName(p), kind:'root', main:true,
          lines:(PROJ.byPath[p]||{}).lines || ast.lines, count:ast.functions.length + ast.methods.length });
    (ast.classes||[]).forEach(function(c){ add({ id:p+'::'+c.name, type:'cls', file:p, label:c.name,
          cls:c.name, line:c.line, kind:'models', sub:'class' }); });
    (ast.functions||[]).forEach(function(f){ add({ id:p+'::'+f.name, type:'def', file:p, label:f.name+'()',
          line:f.line, kind:'root', entry:!!ast.hasMain, sub:'def' }); });
    (ast.methods||[]).forEach(function(m){ add({ id:p+'::'+(m.cls||'')+'.'+m.name, type:'def', file:p,
          cls:m.cls, label:(m.cls?m.cls+'.':'')+m.name+'()', line:m.line, kind:'models', sub:'def' }); });

    // 同文件内的调用
    (ast._resolvedCalls||[]).forEach(function(rc){
      if (rc.from.file !== p || !rc.to || rc.to.file !== p) return;
      var fromId = p+'::' + funcId(ast, rc.from.inFunc);
      var toId = p+'::' + funcId(ast, rc.to.name, rc.to.cls);
      if (seen[fromId] && seen[toId] && fromId !== toId)
        edges.push({ s:fromId, t:toId, line:rc.from.line, cross:false, call:true });
    });
    // 跨文件调用：目标文件里建"调用目标"stub 节点
    rel.callsOut.forEach(function(c){
      var tfile = c.file;
      var tid = tfile + '::@' + (c.cls ? c.cls+'.' : '') + c.name;
      add({ id:tid, type:'def', file:tfile, label:(c.cls?c.cls+'.':'')+c.name+'()', line:c.targetLine,
            kind:fileKind(tfile), sub:'被调用', stub:true });
      var ast2 = PROJ.py[p];
      var fromId = p+'::' + funcId(ast2, whichCaller(ast2, c.line));
      if (seen[fromId] && seen[tid]) edges.push({ s:fromId, t:tid, line:c.line, cross:true, call:true });
    });
    // 未定义调用
    if ($('opt-miss') === null || $('opt-miss').checked){
      rel.undefined.forEach(function(u){
        var mid = p + '::!!' + u.expr;
        add({ id:mid, type:'missing', file:p, label:'⚠ ' + u.expr, line:u.line, kind:'missing', sub:'未定义' });
        var ast3 = PROJ.py[p];
        var fromId = p+'::' + funcId(ast3, u.inFunc);
        if (seen[fromId] && seen[mid]) edges.push({ s:fromId, t:mid, line:u.line, cross:false, call:true, miss:true });
      });
    }
    // 文件级 import 连线
    if ($('opt-imp') === null || $('opt-imp').checked){
      rel.imports.forEach(function(e){ if (e.dst) add({ id:e.dst, type:'file', file:e.dst, label:baseName(e.dst),
          kind:fileKind(e.dst), lines:(PROJ.byPath[e.dst]||{}).lines||0, count:0 }); });
      rel.importedBy.forEach(function(e){ add({ id:e.src, type:'file', file:e.src, label:baseName(e.src),
          kind:fileKind(e.src), lines:(PROJ.byPath[e.src]||{}).lines||0, count:0 }); });
      rel.imports.forEach(function(e){ if (e.dst && seen[e.dst]) edges.push({ s:p, t:e.dst, line:e.line, imp:true, cross:true,
          label:(e.symbols||[]).slice(0,2).join(',') }); });
      rel.importedBy.forEach(function(e){ if (seen[e.src]) edges.push({ s:e.src, t:p, line:e.line, imp:true, cross:true, label:'' }); });

function funcId(ast, name, cls){

function whichCaller(ast, line){

  (ast.methods||[]).forEach(function(m){ if (m.line <= line && (!best || m.line > best.line)) best = m; });
  (ast.functions||[]).forEach(function(f){ if (f.line <= line && (!best || f.line > best.line)) best = f; });

/* ---------- 分层布局：文件容器 + 内部按行号排列 ---------- */
function layeredLayout(nodes, edges){
  var byFile = {};

  // 文件层级：以当前文件为 0，被调用/被导入 → 左(-1)，调用/导入出去 → 右(+1)
  var depth = {}, files = Object.keys(byFile);
  if (UI.mode === 'all'){
    var def = {}, used = {};
    edges.forEach(function(e){ if (e.imp){ used[e.t] = 1; if (def[e.s] === undefined) def[e.s] = 0; def[e.t] = (def[e.s]||0) + 1; } });
    files.forEach(function(f){ depth[f] = def[f] !== undefined ? def[f] : 0; });
    var min = Math.min.apply(null, files.map(function(f){ return depth[f]; }));
    files.forEach(function(f){ depth[f] -= min; });
  } else {
    var p = normPath(UI.sel);
    depth[p] = 0;
    files.forEach(function(f){ if (f !== p) depth[f] = 1; });
    PROJ.importEdges.forEach(function(e){
      if (e.dst === p) depth[e.src] = -1;
      if (e.src === p && e.dst) depth[e.dst] = 1;

    nodes.forEach(function(n){

  }
  var cols = {};
  files.forEach(function(f){ var d = depth[f] || 0; (cols[d] = cols[d] || []).push(f); });

  var COL_GAP = 90, PAD_X = 70, PAD_Y = 60, BOX_W = 250, ROW_H = 26, HEAD_H = 40;
  var colKeys = Object.keys(cols).map(Number).sort(function(a,b){ return a-b; });
  var x = PAD_X;
  var boxes = [];
  colKeys.forEach(function(d){
    var y = PAD_Y, maxW = BOX_W;
    cols[d].sort().forEach(function(f){
      var items = byFile[f].filter(function(n){ return n.type !== 'file'; });
      items.sort(function(a,b){ return (a.line||0) - (b.line||0); });
      var more = 0;
      if (items.length > 80){ more = items.length - 80; items = items.slice(0, 80); }
      var box = { file:f, name:baseName(f), depth:d, x:x, y:y, w:BOX_W, h:HEAD_H + items.length*ROW_H + 14, items:items };
      items.forEach(function(n, i){ n.x = box.x + 14; n.y = box.y + HEAD_H + i*ROW_H + 10; n.w = box.w - 28; n.h = ROW_H - 6; });
      var head = byFile[f].filter(function(n){ return n.type === 'file'; })[0];
      if (head){ head.x = box.x + box.w/2; head.y = box.y + 18; }
      y += box.h + 26;
      boxes.push(box);
    });
    x += maxW + COL_GAP;
  });

}

function renderGraph(){

function draw(){

    ctx.beginPath();

    ctx.lineTo(box.x+box.w, box.y+box.h-rr);
    ctx.quadraticCurveTo(box.x+box.w, box.y+box.h, box.x+box.w-rr, box.y+box.h);
    ctx.lineTo(box.x+rr, box.y+box.h);
    ctx.quadraticCurveTo(box.x, box.y+box.h, box.x, box.y+box.h-rr);
    ctx.lineTo(box.x, box.y+rr);
    ctx.quadraticCurveTo(box.x, box.y, box.x+rr, box.y);
    ctx.closePath();
    ctx.fillStyle = isCur ? '#eff6ff' : '#ffffff'; ctx.fill();
    ctx.lineWidth = isCur ? 2 : 1; ctx.strokeStyle = isCur ? '#2563eb' : '#dbe3ec'; ctx.stroke();

    ctx.quadraticCurveTo(box.x+box.w, box.y, box.x+box.w, box.y+rr);
    ctx.lineTo(box.x+box.w, box.y+HEADH); ctx.lineTo(box.x, box.y+HEADH); ctx.lineTo(box.x, box.y+rr);
    ctx.quadraticCurveTo(box.x, box.y, box.x+rr, box.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12.5px "Microsoft YaHei",sans-serif'; ctx.textAlign = 'left';
    ctx.fillText((isCur?'▶ ':'') + box.name, box.x + 10, box.y + 18);
    ctx.font = '10.5px "Microsoft YaHei",sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
    var head = UI.index[box.file];
    ctx.fillText(box.depth === 0 ? '当前文件' : (box.depth < 0 ? '← 调用/导入本文件' : '本文件调用/导入 →'), box.x + 10, box.y + 32);

}
var HEADH = 40;
function fit(){

  UI.boxes.forEach(function(b){

    miny = Math.min(miny, b.y); maxy = Math.max(maxy, b.y + b.h);

  var sx = (W-pad*2)/Math.max(1,maxx-minx), sy = (H-pad*2)/Math.max(1,maxy-miny);

}
function pick(p){
