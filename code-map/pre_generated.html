    // 箭头
    var ang = Math.atan2(b.y-a.y, b.x-a.x), r = (b.r||16)+4;
    var tx = b.x - Math.cos(ang)*r, ty = b.y - Math.sin(ang)*r;
    ctx.beginPath();
    ctx.moveTo(tx,ty);
    ctx.lineTo(tx-Math.cos(ang-0.4)*9, ty-Math.sin(ang-0.4)*9);
    ctx.lineTo(tx-Math.cos(ang+0.4)*9, ty-Math.sin(ang+0.4)*9);
    ctx.closePath();
    ctx.fillStyle = e.cross ? '#3b82f6' : '#94a3b8'; ctx.fill();
    if (e.label && !dim && E.scale > 0.6){
      ctx.globalAlpha = 0.95; ctx.fillStyle='#64748b'; ctx.font='10px sans-serif';
      ctx.fillText(e.label, (a.x+b.x)/2+4, (a.y+b.y)/2-3);
    }
  });

  E.nodes.forEach(function(n){
    var dim = (E.sel && !hi[n.id]) || !matchNode(n);
    ctx.globalAlpha = dim ? 0.25 : 1;
    var r = n.type==='file' ? 13 + Math.min(9, n.deg*0.5) : 8 + Math.min(7, n.deg*0.35);
    n.r = r;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    ctx.fillStyle = COLORS[n.kind] || '#64748b';
    if (n.missing){ ctx.setLineDash([3,3]); ctx.lineWidth=2; ctx.strokeStyle='#dc2626'; ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.fill(); }
    if (n.id === E.sel){ ctx.lineWidth=3; ctx.strokeStyle='#111827'; ctx.stroke(); }
    else if (n.is_entry || n.has_main){ ctx.lineWidth=2.4; ctx.strokeStyle='#16a34a'; ctx.stroke(); }
    if (!dim && (E.scale > 0.45 || n.id===E.sel || n.type==='file')){
      ctx.fillStyle = '#111827'; ctx.font = (n.type==='file'?'bold ':'') + (12/Math.max(0.7,E.scale)) + 'px "Microsoft YaHei",sans-serif';
      ctx.textAlign='center';
      ctx.fillText(n.label, n.x, n.y - r - 5);
    }
  });
  ctx.globalAlpha = 1; ctx.restore();
}

// ---------- 交互 ----------
function toWorld(ev){
  var r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left - E.ox)/E.scale, y: (ev.clientY - r.top - E.oy)/E.scale };
}
function pick(p){
  for (var i=E.nodes.length-1;i>=0;i--){
    var n = E.nodes[i], dx = p.x-n.x, dy = p.y-n.y;
    if (dx*dx+dy*dy <= (n.r||14)*(n.r||14)) return n;
  }
  return null;
}
cv.addEventListener('wheel', function(e){
  e.preventDefault();
  var r = cv.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
  var f = e.deltaY < 0 ? 1.12 : 1/1.12, ns = Math.max(0.12, Math.min(3, E.scale*f));
  E.ox = mx - (mx - E.ox) * (ns/E.scale); E.oy = my - (my - E.oy) * (ns/E.scale); E.scale = ns; draw();
}, { passive:false });
cv.addEventListener('mousedown', function(e){
  var p = toWorld(e), n = pick(p);
  if (n){ E.drag = n; cv.classList.add('dragging'); showPanel(n); }
  else { E.panning = true; E.px = e.clientX; E.py = e.clientY; cv.classList.add('dragging'); E.sel=null; draw(); }
});
window.addEventListener('mousemove', function(e){
  if (E.drag){ var p = toWorld(e); E.drag.x = p.x; E.drag.y = p.y; draw(); }
  else if (E.panning){ E.ox += e.clientX - E.px; E.oy += e.clientY - E.py; E.px = e.clientX; E.py = e.clientY; draw(); }
});
window.addEventListener('mouseup', function(){ E.drag=null; E.panning=false; cv.classList.remove('dragging'); });
cv.addEventListener('dblclick', function(e){ var n = pick(toWorld(e)); if(n){ E.sel=n.id; E.ox = stage.clientWidth/2 - n.x*E.scale; E.oy = stage.clientHeight/2 - n.y*E.scale; draw(); showPanel(n);} });

function showPanel(n){
  E.sel = n.id; var out = [], inn = [];
  E.edges.forEach(function(e){
    if (e.s === n.id) out.push(e);
    if (e.t === n.id) inn.push(e);
  });
  var h = '<h2>' + esc(n.label) + '</h2>';
  h += '<div><span class="pill">' + (n.type==='file'?'文件':'函数') + '</span>';
  h += '<span class="pill">' + esc(n.sub) + '</span>';
  if (n.is_entry || n.has_main) h += '<span class="pill ok">入口</span>';
  if (n.missing) h += '<span class="pill warn">被调用但未定义</span>';
  if (n.deg) h += '<span class="pill">连接 ' + n.deg + '</span>';
  h += '</div>';
  if (n.missing && n.sites) h += '<p style="font-size:12px;color:#b91c1c">调用点：' + n.sites.map(esc).join('、') + '</p>';
  h += '<details open><summary>⬅ 被谁调用 (' + inn.length + ')</summary><div style="margin-top:6px">';
  h += inn.length ? inn.map(function(e){ var o=E.index[e.s]; return '<div class="nb" data-go="'+esc(e.s)+'">'+esc(o?o.label:e.s)+'<span class="ln">'+esc(o?o.sub:'')+' ← 本处 L'+e.line+'</span></div>'; }).join('') : '<div style="font-size:12px;color:#94a3b8">（没有其他节点调用它）</div>';
  h += '</div></details>';
  h += '<details open><summary>➡ 它调用了谁 (' + out.length + ')</summary><div style="margin-top:6px">';
  h += out.length ? out.map(function(e){ var o=E.index[e.t]; return '<div class="nb" data-go="'+esc(e.t)+'">'+esc(o?o.label:e.t)+'<span class="ln">'+(o?esc(o.sub):'')+' · L'+e.line+'</span></div>'; }).join('') : '<div style="font-size:12px;color:#94a3b8">（没有调用其他节点）</div>';
  h += '</div></details>';
  document.getElementById('panel').innerHTML = h;
  document.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(){
      var t = E.index[el.getAttribute('data-go')];
      if (t) { showPanel(t); E.ox = stage.clientWidth/2 - t.x*E.scale; E.oy = stage.clientHeight/2 - t.y*E.scale; draw(); }
    });
  });
  draw();
}
function esc(s){ return String(s===undefined?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

function legend(){
  var L = document.getElementById('legend');
  if (E.view === 'files'){
    L.innerHTML = '<div><i style="background:'+COLORS.root+'"></i>根目录脚本</div>' +
                  '<div><i style="background:'+COLORS.models+'"></i>models 包</div>' +
                  '<div><i style="background:'+COLORS.tests+'"></i>tests 包</div>' +
                  '<div style="margin-top:4px">蓝线箭头 = import 方向（线上文字是被导入的符号）</div>';
  } else {
    L.innerHTML = '<div><i style="background:'+COLORS.root+'"></i>根目录函数</div>' +
                  '<div><i style="background:'+COLORS.models+'"></i>models 函数</div>' +
                  '<div><i style="background:#dc2626"></i>未定义(被调用但没实现)</div>' +
                  '<div style="margin-top:4px">蓝线=跨文件调用 · 灰线=同文件调用 · 绿圈=入口函数</div>';
  }
}

function insights(){
  var b = document.getElementById('insight-body');
  var h = '<ul>';
  h += '<li>共 <b>' + INSIGHTS.file_count + '</b> 个文件 · <b>' + INSIGHTS.func_count + '</b> 个函数/方法 · <b>' + INSIGHTS.edge_count + '</b> 条调用边（跨文件 ' + INSIGHTS.cross_count + ' 条）</li>';
  h += '<li>入口文件：' + INSIGHTS.main_files.map(function(f){return '<code>'+f+'</code>';}).join('、') + '</li>';
  if (INSIGHTS.missing.length){
    h += '<li style="color:#b91c1c"><b>⚠ 被调用但未定义的方法（' + INSIGHTS.missing.length + ' 个）</b>：定义处已被注释掉，主程序仍在调用，运行到就会崩：<ul>';
    INSIGHTS.missing.forEach(function(m){
      h += '<li><code>' + m.name + '</code> ← 调用方：' + m.called_by.map(function(x){return '<code>'+x+'</code>';}).join('、') + '（' + m.sites.join('、') + '）</li>';
    });
    h += '</ul></li>';
  }
  h += '<li>文件依赖：<ul>' + INSIGHTS.import_list.map(function(e){
      return '<li><code>'+e.src+'</code> → <code>'+e.dst+'</code> <span style="color:#94a3b8">['+(e.symbols.join(', ')||e.module)+'] L'+e.line+'</span></li>';
  }).join('') + '</ul></li>';
  h += '<li>被调用最多的函数：<ul>' + INSIGHTS.hottest.map(function(t){
      return '<li><code>'+t[0]+'</code> · '+t[1]+' · 被调 '+t[2]+' 次</li>';
  }).join('') + '</ul></li>';
  h += '<li>各文件函数数量：' + INSIGHTS.per_file.map(function(p){ return '<code>'+p[0]+'</code>('+p[1]+')'; }).join(' · ') + '</li>';
  h += '</ul>';
  b.innerHTML = h;
}

// ---------- 顶部控件 ----------
document.getElementById('tab-files').addEventListener('click', function(){
  E.view='files'; this.classList.add('on'); document.getElementById('tab-funcs').classList.remove('on');
  document.getElementById('filefilter').style.display='none'; E.sel=null; E.fileFilter='';
  build(); legend(); fit();
});
document.getElementById('tab-funcs').addEventListener('click', function(){
  E.view='funcs'; this.classList.add('on'); document.getElementById('tab-files').classList.remove('on');
  document.getElementById('filefilter').style.display=''; E.sel=null;
  build(); legend(); fit();
});
document.getElementById('filefilter').addEventListener('change', function(){ E.fileFilter = this.value; E.sel=null; build(); fit(); });
document.getElementById('q').addEventListener('input', function(){ E.q = this.value; draw(); });
document.getElementById('fit').addEventListener('click', fit);
document.getElementById('relayout').addEventListener('click', function(){ E.nodes.forEach(function(n){ n.x=undefined; }); build(); fit(); });
window.addEventListener('resize', draw);

(function init(){
  document.getElementById('subtitle').textContent = DATA.meta.root + ' · 生成于 ' + DATA.meta.generated;
  var sel = document.getElementById('filefilter');
  DATA.files.forEach(function(f){ var o=document.createElement('option'); o.value=f.path; o.textContent=f.path; sel.appendChild(o); });
  sel.style.display='none';
  insights(); build(); legend(); fit();
})();
</script>
</body>
